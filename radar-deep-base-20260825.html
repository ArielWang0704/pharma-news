        industry: '这条财报更像一个“需要解释的结果”，而不是结论本身。对成熟品牌公司，增长质量比headline增速更重要：如果来自真实患者需求和终端扩张，可持续性更高；如果来自渠道补库存或一次性phasing，则需要警惕未来回吐。',
        implication: '管理层分析应该把外部财报与内部经营数据连接起来：品牌贡献、渠道购进/纯销、库存、净销售、价格、区域增长是否一致。对PMO/业财而言，价值在于找出“公开结果背后的经营机制”，并把政策变化与经营数字串起来，而不是重复财报数字。',
        viatris: '这本身就是Viatris高相关事件。建议后续形成一张Greater China增长桥：按核心品牌→渠道→量/价/库存拆分16%运营增长，并标出基药、集采和渠道模式变化可能影响的部分。这样外部市场雷达才能真正与内部业务分析互相验证。',
        validation: ['核心品牌对Greater China增长的贡献','医院/零售/电商/基层渠道增速差异','销量、价格、库存和一次性phasing拆分','渠道购进与终端纯销是否一致','H2基药/集采执行是否改变增长结构']
      },
      'glp1-china-2026': {
        conclusion: '中国GLP-1竞争已经从“谁减重更多”进入完整患者旅程竞争：疾病认知、获客、问诊、处方、支付、供货、复购和合规都会决定商业化结果。药品本身只是其中一环。',
        facts: [
          '中国市场同时出现注射与口服剂型、MNC与本土创新药、医保申报、自费渠道和仿制化等多条竞争线。',
          '8月Reuters进一步报道多家公司加大肥胖疾病教育和消费者触达，因为处方药广告受限，企业更多通过地铁、健身/运动场景及睡眠呼吸暂停、脂肪肝等疾病教育连接潜在患者。',
          '零售、线上健康管理、私立医疗和传统医院正在成为不同的患者承接入口，渠道能力开始与临床疗效同样影响放量速度。'
        ],
        background: '肥胖与传统处方药市场不同：大量潜在患者并不会主动认为自己“需要用药”，支付又以自费为主，因此市场首先要完成疾病认知和就医转化。与此同时，处方药推广受到严格监管，企业必须在疾病教育与变相产品宣传之间保持边界。GLP-1因此把消费医疗式获客和严格处方药合规放在了同一个商业模型里。',
        mechanism: ['疾病教育/口碑 → 激活潜在患者','线上/私立/医院问诊 → 形成合规处方','医保/自费/商保 → 决定支付可及','零售/电商/DTP → 决定购药便利','供应与复购 → 决定长期患者价值','剂型/疗效/耐受性 → 决定患者分层和品牌选择'],
        industry: '竞争会逐渐从单品“峰值销售”转向portfolio：不同患者可能在口服/注射、疗效/耐受、价格/便利性之间做选择。拥有多剂型、多适应症、强供应和强患者触达能力的公司更有优势；仅依靠单个临床指标领先但缺乏支付和渠道能力的产品，商业化未必同样领先。',
        implication: '分析慢病创新药时，应把患者journey画出来，而不是只比较临床数据。市场、医学、准入、数字渠道、零售和合规必须共同设计：谁负责疾病教育，谁完成问诊，处方如何流转，药在哪里交付，患者如何长期复购和监测。',
        validation: ['口服GLP-1在中国的审批和上市节奏','医保/商保对肥胖适应症的支付范围','疾病教育与处方药广告监管边界是否收紧','线上平台、零售和私立医疗的患者转化效率','Novo/Lilly/本土企业的价格与供应策略','长期复购和停药率是否成为商业化分水岭']
      }
    };

    function installDeepDive(innerWin) {
      if (!innerWin || innerWin.__deepDiveInstalled) return;
      try {
        const doc = innerWin.document;
        const style = doc.createElement('style');
        style.textContent = `
          .deep-section{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:0 0 10px;background:#fbfcfe}
          .deep-section h3{margin:0 0 8px;color:var(--primary);font-size:14px}
          .deep-section p{margin:0;color:#344054;line-height:1.72;font-size:13px}
          .deep-list{margin:0;padding-left:20px;color:#344054;font-size:13px;line-height:1.7}
          .deep-list li+li{margin-top:5px}
          .logic-chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
          .logic-step{background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:6px 9px;font-size:12px;line-height:1.35}
          .logic-arrow{color:var(--muted);font-size:12px}
          .viatris-deep{background:var(--warning-soft);border-color:#ead7aa}
          .deep-kicker{font-weight:700;color:var(--primary)}
        `;
        doc.head.appendChild(style);

        innerWin.deepDiveOverrides = deepDiveOverrides;
        innerWin.eval(`
          newsData.forEach(item => {
            if (window.deepDiveOverrides[item.id]) item.deepDive = window.deepDiveOverrides[item.id];
          });

          window.__originalRadarRenderCard = renderCard;
          renderCard = function(item) {
            if (!item.deepDive) return window.__originalRadarRenderCard(item);
            const d = item.deepDive;
            const tagHtml = item.tags.map(tag => '<span class="badge">' + tag + '</span>').join('');
            const timelineHtml = item.updates.slice().sort((a,b) => b.date.localeCompare(a.date)).map(u =>
              '<div class="event"><div class="event-date">' + formatDate(u.date) + '</div><div class="event-body">' + u.text + '</div></div>'
            ).join('');
            const sourceHtml = item.sources.map(src => '<a href="' + src.url + '" target="_blank" rel="noopener">' + src.label + '</a>').join(' · ');
            const factsHtml = (d.facts || []).map(x => '<li>' + escapeHtml(x) + '</li>').join('');
            const validationHtml = (d.validation || []).map(x => '<li>' + escapeHtml(x) + '</li>').join('');
            const mechanismHtml = (d.mechanism || []).map((x,i,a) => '<span class="logic-step">' + escapeHtml(x) + '</span>' + (i < a.length-1 ? '<span class="logic-arrow">→</span>' : '')).join('');
            const viatrisHtml = d.viatris ? '<div class="deep-section viatris-deep"><h3>对Viatris的潜在影响</h3><p>' + escapeHtml(d.viatris) + '</p></div>' : '';
            return '<article class="card">' +
              '<div class="card-main"><div class="card-top"><div><h2>' + item.title + '</h2></div><div class="date">' + formatDate(item.date) + '</div></div>' +
              '<p class="summary">' + item.summary + '</p><div class="badges"><span class="badge secondary">' + item.category + '</span>' +
              (isHighImpact(item.viatrisImpact) ? '<span class="badge warning">Viatris高相关</span>' : '') + tagHtml + '</div></div>' +
              '<details><summary>展开深度解读、影响机制和后续验证</summary>' +
              '<div class="deep-section"><h3>一句话结论</h3><p class="deep-kicker">' + escapeHtml(d.conclusion) + '</p></div>' +
              '<div class="deep-section"><h3>关键事实</h3><ul class="deep-list">' + factsHtml + '</ul></div>' +
              '<div class="deep-section"><h3>背景与前因</h3><p>' + escapeHtml(d.background) + '</p></div>' +
              '<div class="deep-section"><h3>核心变化 / 影响机制</h3><div class="logic-chain">' + mechanismHtml + '</div></div>' +
              '<div class="deep-section"><h3>对行业格局的影响</h3><p>' + escapeHtml(d.industry) + '</p></div>' +
              '<div class="deep-section"><h3>对药企 / 岗位意味着什么</h3><p>' + escapeHtml(d.implication) + '</p></div>' + viatrisHtml +
              '<div class="deep-section"><h3>后续验证什么</h3><ul class="deep-list">' + validationHtml + '</ul></div>' +
              '<h3 style="margin:14px 0 8px;color:var(--primary);font-size:13px;">事件进展</h3><div class="timeline">' + timelineHtml + '</div>' +
              '<div class="sources">' + sourceHtml + '</div></details></article>';
          };
          render();
          window.__deepDiveInstalled = true;
        `);
        innerWin.__deepDiveInstalled = true;
      } catch (e) {
        console.error('deep dive install failed', e);
      }
    }

    function tryInstall() {
      try {
        const outerWin = baseFrame.contentWindow;
        const innerFrame = outerWin.document.getElementById('radarFrame');
        if (!innerFrame) return false;
        const innerWin = innerFrame.contentWindow;
        if (!innerWin || innerWin.document.readyState === 'loading') return false;
        installDeepDive(innerWin);
        baseFrame.style.visibility = 'visible';
        return true;
      } catch (e) {
        return false;
      }
    }

    baseFrame.addEventListener('load', () => {
      let tries = 0;
      const timer = setInterval(() => {
        tries += 1;
        if (tryInstall() || tries > 30) {
          clearInterval(timer);
          baseFrame.style.visibility = 'visible';
        }
      }, 150);
    });
  </script>
</body>
</html>
