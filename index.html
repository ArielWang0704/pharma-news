          }

          );

          const originalRenderStats = renderStats;

          if (els.statPageUpdated) els.statPageUpdated.textContent = '2026.08.25';

      `;
      doc.body.appendChild(patchScript);
      setTimeout(() => { frame.style.visibility = 'visible'; }, 80);

      try { injectUpdates(); }

  </script>
