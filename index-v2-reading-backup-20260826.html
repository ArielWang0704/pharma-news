<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>中国医药健康市场雷达</title>
  <link rel="stylesheet" href="v2.css?v=20260826-1">
  <link rel="stylesheet" href="v2-layout-fixes.css?v=20260826-1">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <h1>中国医药健康市场雷达</h1>
        <p>不是“把新闻收进来”，而是持续维护对中国医药市场的判断。</p>
      </div>
      <div class="updated">更新至 <strong>2026.08.25</strong></div>
    </header>

    <nav class="sheet-tabs" aria-label="主视图">
      <button class="sheet-tab active" data-sheet="weekly">本周重点</button>
      <button class="sheet-tab" data-sheet="themes">长期主题</button>
      <button class="sheet-tab" data-sheet="events">全部事件</button>
    </nav>

    <main>
      <section class="sheet active" id="sheet-weekly">
        <div class="section-head">
          <div>
            <span class="eyebrow">WEEKLY RADAR</span>
            <h2>这周真正值得更新认知的事</h2>
            <p>只保留会改变政策理解、竞争格局、商业模式或资源配置的事件；普通新闻不硬凑。</p>
          </div>
          <div class="metric-strip" id="weeklyMetrics"></div>
        </div>
        <div class="weekly-layout">
          <div class="focus-list" id="weeklyFocus"></div>
          <aside class="insight-panel">
            <div class="insight-block">
              <h3>本周形成的判断</h3>
              <div id="weeklyJudgements"></div>
            </div>
            <div class="insight-block">
              <h3>下一步最值得验证</h3>
              <div id="weeklyValidation"></div>
            </div>
          </aside>
        </div>
      </section>

      <section class="sheet" id="sheet-themes">
        <div class="section-head compact">
          <div>
            <span class="eyebrow">LONG-TERM THEMES</span>
            <h2>长期主题</h2>
            <p>把零散新闻沉淀成可持续维护的行业命题；新新闻优先成为主题证据，而不是无限新增卡片。</p>
          </div>
        </div>
        <div class="theme-grid" id="themeGrid"></div>
      </section>

      <section class="sheet" id="sheet-events">
        <div class="section-head compact">
          <div>
            <span class="eyebrow">EVENT ARCHIVE</span>
            <h2>全部事件</h2>
            <p>这里保留完整档案；“重大事件 / 主题节点 / Evidence”分级管理。</p>
          </div>
          <div class="archive-stats" id="archiveStats"></div>
        </div>

        <div class="filters">
          <input id="search" type="search" placeholder="搜索公司、产品、政策、主题……">
          <select id="categoryFilter"><option value="">全部类型</option></select>
          <select id="themeFilter"><option value="">全部主题</option></select>
          <select id="monthFilter"><option value="">全部月份</option></select>
          <select id="levelFilter">
            <option value="">全部层级</option>
            <option value="major">重大事件</option>
            <option value="theme-node">主题节点</option>
            <option value="evidence">Evidence</option>
          </select>
          <label class="check"><input id="viatrisOnly" type="checkbox"> 只看Viatris高相关</label>
        </div>
        <div class="event-list" id="eventList"></div>
        <div class="empty" id="emptyState">没有匹配的事件。</div>
      </section>
    </main>
  </div>
  <script src="v2-app.js?v=20260826-1"></script>
  <script src="v2-interactions.js?v=20260826-1"></script>
</body>
</html>
